<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>目标函数交互演示</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:35px;font:14px/1.9 system-ui,"Microsoft YaHei",sans-serif;background:#f3f1ec;color:#303731}main{max-width:860px;margin:auto}.kicker{font:10px ui-monospace,Consolas,monospace;letter-spacing:2px;color:#706a5f}h1{font:500 27px/1.6 Georgia,"Noto Serif CJK SC","Songti SC",serif;margin:18px 0 12px}p{color:#62665f;font-size:13px}.panel{margin-top:25px;background:#ebe7df;border:1px solid #fffcf5;border-radius:12px;padding:24px;box-shadow:inset 3px 3px 7px #cdc5b9,inset -3px -3px 7px #fffdf7}canvas{display:block;width:100%;height:245px}label{display:block;margin-bottom:15px}input{width:100%;accent-color:#946f48}.values{display:flex;gap:35px;flex-wrap:wrap;margin-top:16px}.value{font:24px/1.6 Georgia,serif;color:#825e3e}.value small{font:11px system-ui,sans-serif;color:#66695f;margin-right:9px}.note{font-size:11px;color:#777064;margin-top:20px}@media(max-width:480px){body{padding:24px 18px}h1{font-size:23px}.panel{padding:16px}canvas{height:210px}}
</style>
</head>
<body><main>
<div class="kicker">INTERACTIVE FILE / DEMO ONLY</div>
<h1>让参数动起来。</h1>
<p>这是一个独立 HTML 文件。拖动滑块，查看构造数据 y = 2x 对应的目标函数 L(θ) = 11(2 − θ)²。它不需要 Python 后端。</p>
<div class="panel"><canvas id="chart" role="img" aria-label="二次目标函数曲线。最小值在 theta 等于 2 处。"></canvas><label for="theta">参数 θ</label><input id="theta" aria-label="参数 theta" type="range" min="0" max="4" step="0.01" value="0.8"><div class="values" aria-live="polite"><span class="value"><small>θ</small><output id="theta-out">0.80</output></span><span class="value"><small>L(θ)</small><output id="loss-out">15.84</output></span></div></div>
<p class="note">示例数据：x = 1, 2, 3, 4, 5；y = 2x。构造数据，仅用于交互演示。<br>看完后，使用外层网页的大按钮返回来源笔记。</p>
</main>
<script>
const canvas=document.getElementById('chart'),slider=document.getElementById('theta');
function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const p={l:38,r:18,t:18,b:38};const x=t=>p.l+t/4*(w-p.l-p.r),y=v=>h-p.b-v/48*(h-p.t-p.b);c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='#d1c9bc';c.fillStyle='#72756b';c.font='10px system-ui';for(let i=0;i<=4;i++){c.beginPath();c.moveTo(x(i),p.t);c.lineTo(x(i),h-p.b);c.stroke();c.fillText(i.toString(),x(i)-3,h-14)}for(let v=0;v<=40;v+=10){c.beginPath();c.moveTo(p.l,y(v));c.lineTo(w-p.r,y(v));c.stroke();c.fillText(v.toString(),9,y(v)+3)}c.strokeStyle='#89613c';c.lineWidth=2.2;c.beginPath();for(let t=0;t<=4.001;t+=0.02){const yy=11*(2-t)**2;if(t===0)c.moveTo(x(t),y(yy));else c.lineTo(x(t),y(yy))}c.stroke();let theta=Number(slider.value),loss=11*(2-theta)**2;c.strokeStyle='#72827b';c.setLineDash([3,4]);c.beginPath();c.moveTo(x(theta),h-p.b);c.lineTo(x(theta),y(loss));c.stroke();c.setLineDash([]);c.fillStyle='#5c7971';c.beginPath();c.arc(x(theta),y(loss),5,0,2*Math.PI);c.fill();document.getElementById('theta-out').textContent=theta.toFixed(2);document.getElementById('loss-out').textContent=loss.toFixed(2)}slider.addEventListener('input',draw);window.addEventListener('resize',draw);draw();
</script></body></html>
